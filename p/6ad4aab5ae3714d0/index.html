<script>
(async()=>{
 const P=JSON.parse(document.getElementById('p').textContent);
 const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
 const norm=c=>c.toLowerCase().replace(/[\s\-]/g,'');
 async function pbk(code,salt,len){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:P.n,hash:'SHA-256'},km,len*8));
 }
 const hex=u=>Array.from(u).map(x=>x.toString(16).padStart(2,'0')).join('');
 async function aes(keyBytes,iv,ct){
  const k=await crypto.subtle.importKey('raw',keyBytes,'AES-GCM',false,['decrypt']);
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},k,ct));
 }
 async function attempt(code){
  try{
   if(P.k){
    const id=hex(await pbk(code,new TextEncoder().encode('cyb-id-v1'),8));
    const slot=P.k.find(x=>x.d===id);
    if(!slot)return null;
    const wk=await pbk(code,b64(slot.s),32);
    const ck=await aes(wk,b64(slot.i),b64(slot.c));
    return new TextDecoder().decode(await aes(ck,b64(P.i),b64(P.c)));
   }
   const pt=await aes(await pbk(code,b64(P.s),32),b64(P.i),b64(P.c));
   return new TextDecoder().decode(pt);
  }catch(_){return null;}
 }
 function show(html,code){
  try{const k=JSON.parse(sessionStorage.getItem('cyb-codes')||'[]');if(!k.includes(code))k.push(code);sessionStorage.setItem('cyb-codes',JSON.stringify(k));}catch(_){}
  document.open();document.write(html);document.close();
 }
 if(!window.crypto||!crypto.subtle){document.documentElement.className='';document.getElementById('w').textContent='Ce navigateur ne permet pas le déverrouillage. Ouvre la page dans un navigateur récent.';return;}
 let stored=[];try{stored=JSON.parse(sessionStorage.getItem('cyb-codes')||'[]');}catch(_){}
 try{for(const c of JSON.parse(localStorage.getItem('cyb-keep')||'[]'))if(!stored.includes(c))stored.push(c);}catch(_){}
 for(const c of stored){const h=await attempt(c);if(h!==null){show(h,c);return;}}
 document.getElementById('w').hidden=true;document.documentElement.className='';
 const f=document.getElementById('f');f.hidden=false;
 f.addEventListener('submit',async ev=>{
  ev.preventDefault();
  const e=document.getElementById('e'),btn=document.getElementById('b');
  e.textContent='';btn.disabled=true;btn.textContent='Vérification…';
  const code=norm(document.getElementById('c').value);
  const h=await attempt(code);
  if(h===null){e.textContent='Code incorrect. Vérifie-le et réessaie.';btn.disabled=false;btn.textContent='Ouvrir';}
  else show(h,code);
 });
})();
</script></body></html>
